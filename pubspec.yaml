name: flipster_game
description: Flipster card matching game with Firebase

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase packages — these 3 are all you need
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_auth: ^4.16.0   # optional, keep for future login feature

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/png1.jpeg
    - assets/images/png2.jpeg
    - assets/images/png3.jpeg
    - assets/images/png4.jpeg
    - assets/images/png5.jpeg


firebase_core: ^2.32.0
cloud_firestore: ^5.6.0